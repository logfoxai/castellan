name: Release

# Triggered by CI completing successfully on main/next. CI is the gate; release
# never runs unless CI passed. This catches admin force-pushes that bypass checks.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, next]

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    env:
      # prod CloudFront (main only) — stack: infra/prod/us-east-2/static/castellan
      PROD_ACCOUNT: ${{ secrets.AWS_ACCOUNT_PROD }}
      PROD_AWS_REGION: us-east-2
      PROD_DEPLOY_ROLE: gh-deploy-castellan
      PROD_SSM_BUCKET_PARAM: /logfox/prod/castellan/assetsBucket
      PROD_SSM_DISTRIBUTION_PARAM: /logfox/prod/castellan/cloudfrontDistributionId
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/castellan:latest
            ghcr.io/${{ github.repository_owner }}/castellan:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        run: |
          gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/castellan" \
            -f visibility=public

      - name: Configure AWS credentials
        if: github.event.workflow_run.head_branch == 'main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.PROD_AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.PROD_ACCOUNT }}:role/${{ env.PROD_DEPLOY_ROLE }}

      - name: Load publish targets from SSM
        if: github.event.workflow_run.head_branch == 'main'
        run: |
          set -eux
          echo "S3_BUCKET=$(aws ssm get-parameter --name "$PROD_SSM_BUCKET_PARAM" --query Parameter.Value --output text)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(aws ssm get-parameter --name "$PROD_SSM_DISTRIBUTION_PARAM" --query Parameter.Value --output text)" >> "$GITHUB_ENV"

      - name: Deploy docs site
        if: github.event.workflow_run.head_branch == 'main'
        run: ./deploy-docs.sh
        env:
          S3_BUCKET: ${{ env.S3_BUCKET }}
          DISTRIBUTION_ID: ${{ env.DISTRIBUTION_ID }}

      - run: npx autorel@^2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
